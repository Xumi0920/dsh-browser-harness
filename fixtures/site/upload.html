<!doctype html>
<html><head><meta charset="utf-8"><title>Upload - Fixture</title></head>
<body>
  <h1>Upload</h1>
  <input id="file" type="file">
  <input id="hidden-file" type="file" style="display:none">
  <p id="result">no file</p>
  <script>
    function read(fileInput, label) {
      fileInput.addEventListener('change', function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) { document.getElementById('result').textContent = label + ':none'; return; }
        file.text().then(function (text) { document.getElementById('result').textContent = label + ':' + file.name + ':' + text.trim(); });
      });
    }
    read(document.getElementById('file'), 'visible');
    read(document.getElementById('hidden-file'), 'hidden');
  </script>
</body></html>
