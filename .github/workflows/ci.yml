name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/unit/**/*.test.mjs"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate Chrome
        run: |
          if command -v google-chrome > /dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable > /dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/chromium ]; then
            echo "CHROME_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
          else
            echo "::error::No Chrome/Chromium found; integration scenarios would silently skip."
            exit 1
          fi
      - name: Install xvfb for the headful tab-group scenario
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run scenario suite
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" node --test --test-reporter=tap "tests/integration/**/*.test.mjs" | tee tap.txt
      - name: Verify the scenario suite really ran
        shell: bash
        run: |
          tests=$(grep -E '^# tests [0-9]+' tap.txt | awk '{print $3}')
          failed=$(grep -E '^# fail [0-9]+' tap.txt | awk '{print $3}')
          skipped=$(grep -E '^# skipped [0-9]+' tap.txt | awk '{print $3}')
          echo "tests=${tests:-?} failed=${failed:-?} skipped=${skipped:-?}"
          # The suite is complete at 27 scenarios, and both tab-group scenarios
          # must actually execute on Linux: S15 (headless degradation) and S16
          # (headful grouping under xvfb). T11 may skip when no alternate
          # Chromium is installed, so at most one skip is tolerated.
          [ "${tests:-0}" = "27" ] || { echo "::error::expected 27 integration scenarios, got ${tests:-0}"; exit 1; }
          [ "${failed:-1}" = "0" ] || { echo "::error::${failed:-?} integration scenario(s) failed"; exit 1; }
          s15=$(grep -E '^ok [0-9]+ - S15 ' tap.txt || true)
          s16=$(grep -E '^ok [0-9]+ - S16 ' tap.txt || true)
          case "${s15}" in
            "") echo "::error::S15 (headless tab-group degradation) did not run"; exit 1 ;;
            *"# SKIP"*) echo "::error::S15 was skipped"; exit 1 ;;
          esac
          case "${s16}" in
            "") echo "::error::S16 (headful tab grouping) did not run; xvfb or the MV3 extension regressed"; exit 1 ;;
            *"# SKIP"*) echo "::error::S16 was skipped; xvfb/headful Chrome is broken"; exit 1 ;;
          esac
          [ "${skipped:-0}" -le 1 ] || { echo "::error::unexpected number of skipped scenarios: ${skipped}"; exit 1; }
