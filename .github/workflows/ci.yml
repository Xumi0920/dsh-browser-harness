name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/unit/**/*.test.mjs"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate Chrome
        run: |
          if command -v google-chrome > /dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable > /dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/chromium ]; then
            echo "CHROME_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
          else
            echo "::error::No Chrome/Chromium found; integration scenarios would silently skip."
            exit 1
          fi
      - name: Run scenario suite
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap "tests/integration/**/*.test.mjs" | tee tap.txt
      - name: Fail on skipped scenarios
        run: |
          if grep -Eq '(^# skipped [1-9]|# SKIP)' tap.txt; then
            echo "::error::Integration scenarios were skipped (no Chrome?); refusing a false-green run."
            exit 1
          fi
