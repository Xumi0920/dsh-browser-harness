<!doctype html>
<html><head><meta charset="utf-8"><title>Form - Fixture</title></head>
<body>
  <h1>Form</h1>
  <form id="form" novalidate>
    <input id="name" required placeholder="name">
    <select id="color"><option value="red">Red</option><option value="green">Green</option><option value="blue">Blue</option></select>
    <label><input id="agree" type="checkbox"> Agree</label>
    <button id="submit" type="submit">Submit</button>
  </form>
  <p id="err" style="display:none;color:#b00020">name is required</p>
  <p id="ok" style="display:none;color:#0b6b0b">submitted</p>
  <script>
    document.getElementById('form').addEventListener('submit', function (event) {
      var name = document.getElementById('name').value.trim();
      if (!name) {
        event.preventDefault();
        document.getElementById('err').style.display = 'block';
        return;
      }
      event.preventDefault();
      document.getElementById('ok').style.display = 'block';
      document.getElementById('ok').textContent = 'submitted:' + name;
    });
  </script>
</body></html>
