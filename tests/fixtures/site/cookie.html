<!doctype html>
<html><head><meta charset="utf-8"><title>Cookie - Fixture</title></head>
<body>
  <h1>Cookie</h1>
  <script>
    var params = new URLSearchParams(location.search);
    var name = params.get('name') || 'bh_probe';
    var value = params.get('value') || '1';
    document.cookie = name + '=' + value + '; path=/';
  </script>
</body></html>
