<!doctype html>
<html><head><meta charset="utf-8"><title>Overlay - Fixture</title></head>
<body>
  <button id="target" onclick="window.targetClicks = (window.targetClicks || 0) + 1">target</button>
  <div id="overlay" style="position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.12)" onclick="window.overlayClicks = (window.overlayClicks || 0) + 1">overlay</div>
</body></html>
